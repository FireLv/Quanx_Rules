// ==UserScript==
// @ScriptName        京东 去开屏广告（素材预取拦截）
// @Author            规则体系 @ddgksf2013｜本文件由 2026-09-19 抓包实证整理
// @UpdateTime        2026-09-20
// @Evidence          quantumult-x-2026-09-19-133652.har（522 条请求，京东 16.0.0，UA: JD4iPhone/16.0.0）
// @CrossCheck        墨鱼去开屏 V2.0 京东段 functionId=(start|queryMaterialAdverts) 已标 [invalid]（京东 16.x 取数改为加密通道+本地缓存，URL 层已不可见）；本规则为素材层拦截，社区无同款
// @Attention         预缓存型开屏：首次启用后旧缓存素材可能再展示一次，需连续两次冷启动才完全生效
// ==/UserScript==


# > 京东开屏素材（全屏专用规格 s1125x2436，iPhone X 比例）：
#   实证为「重磅新品月」开屏图（与截图 IMG_0655 逐像素一致），冷启动后 7 秒预取缓存，
#   供下一次启动展示。拦截后客户端取不到素材即跳过开屏。
#   该规格在本包 522 条请求中仅此 1 条；商品图/图标均为 s714x714 / s240x240 / s225x225 等规格，不受影响。
^https?:\/\/m\.360buyimg\.com\/mobilecms\/s1125x2436_ url reject-200

# ------- 其他大屏机型的全屏规格，本包未出现，默认注释；若换机后发现开屏复发再启用 -------
# ^https?:\/\/m\.360buyimg\.com\/mobilecms\/s1242x2208_ url reject-200
# ^https?:\/\/m\.360buyimg\.com\/mobilecms\/s1283x2778_ url reject-200


# ==== 实证依据 ====
# ⚠ 时间基准：HAR 内 startedDateTime 为 UTC（带 Z 后缀），以下均已换算为北京时间（UTC+8）。
# 北京时间 09-20 08:28:14 冷启动（basicConfig 378KB 等首批请求）；
#   08:28:21.949 下载 m.360buyimg.com/mobilecms/s1125x2436_jfs/t1/519951/24/10653/111559/
#   6aad0b44F6aad1514/0258465984d6dc1d.jpg.avif（200 / 81,658B）。
#   导出该素材转 PNG 后与 IMG_0655 截图逐像素一致 → 确认为开屏广告素材。
#   下载发生在启动后 7 秒（广告已由缓存展示）→ 属「为下一次启动预取缓存」。
#   （HAR 覆盖北京时间 09-19 16:59:51 ~ 09-20 08:28:24）
# 取数接口未捕获：全包无 URL 型 functionId=start；client.action 体内 functionId=startup
#   的响应仅为 {"deviceLevel":1}（设备分级，非广告）；basicConfig 深搜无开屏开关/素材 URL。
#   → 京东 16.x 开屏取数走加密通道且素材走本地缓存，URL 层拦截取数不可行（墨鱼京东段
#   [invalid] 的根因），故改从素材层断供。
#
# ==== 已知局限（重要：决定何时见效）====
# 1. 本规则拦的是「预取写入」，**不会清除已缓存的旧素材**。响应头实证：
#      Referer: download_Image_JDAppHome（首页阶段的图片预下载）
#      Age: 50275（CDN 已缓存约 14 小时 → 本次启动之前 App 就下载过这条素材）
#      Cache-Control: max-age=7800472（≈90 天 → 客户端长期缓存）
#    因此：启用规则后，本地旧缓存仍会继续展示，可能数天内照样出广告。
# 2. 立即见效的做法：启用规则后**卸载重装京东**清掉本地缓存——无缓存可展示、
#    新素材又被拦，开屏直接跳过；此后每次启动的预取都被拦，缓存不会再被刷新。
# 3. 规格变化：若京东日后改用其他全屏规格（如 s1170x2532），需补充对应规则。
# 4. 误伤边界（已核对）：mobilecms 下首页图片规格为 s714x714（商品主图 10 条）、
#    s240x240（14 条）、s225x225（2 条）及无规格（8 条），规则均不命中；
#    全站 360buyimg.com 高度≥1000px 的全屏规格仅 s1125x2436 这一个。
#    唯一残留风险：若某活动页的全屏海报也用 s1125x2436 规格会被一并拦掉，
#    真遇到时把规则收紧为 `mobilecms/s1125x2436_jfs_` 或改用 url reject-img。
# 3. 严禁拦截 mobilecms 的其他尺寸规格（s714x714 商品主图、s240x240/s225x225 列表图），
#    否则首页/商品页图片全部损坏。
#
# ==== 手工并入现有配置 ====
# 规则行复制进 [rewrite_local]；本条为图片 CDN 域，需在 [mitm] hostname 追加：
#   m.360buyimg.com
# （若以远程资源引用则自动并入。）
# ==== 操作说明结束 ====
