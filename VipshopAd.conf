# 唯品会开屏广告屏蔽 - Quantumult X 重写规则
# 基于 2026-09-08 HAR 抓包分析生成 (iOS 唯品会 v9.83.3)
# 用法: 配置 -> 重写 -> 远程重写 -> + -> 重写 -> 粘贴本文件 jsDelivr URL -> 保存
# 需要: MITM 开启 + 证书信任 (QX 抓包/开屏分析场景默认已装)
#
# 说明:
#   - 唯品会开屏广告全走核心业务域 mapi.appvipshop.com, 无法在分流(域名层)精准拦截
#   - 因此使用重写 url reject 在 URL 级拦截, 仅屏蔽广告接口, 不影响首页/商品功能
#   - 素材 CDN (b|h2).appsimg.com 混合承载商品图/品牌图, 域名级拦截会误伤, 故不拦整域

# ===== 开屏广告取数接口 (核心) =====
# 请求体带 is_preload=1 预加载开屏素材, 拒绝后 App 无素材可显示
^https?://mapi\.appvipshop\.com/vips-mobile/rest/activity/advertisement/get url reject

# ===== 弹窗 / 悬浮球 / 浮层 (可选, 不需要可注释) =====
^https?://mapi\.appvipshop\.com/vips-mobile/rest/operation/popup/v1 url reject
^https?://mapi\.appvipshop\.com/vips-mobile/rest/layout/assistant/float_ball url reject
^https?://mapi\.appvipshop\.com/vips-mobile/rest/activity/float_ball/get url reject

# ===== 广告/运营素材目录 (可选, 仅 momin/mst 广告目录, 保留 merchandise/brand 商品图) =====
^https?://(b|h2)\.appsimg\.com/[^/]+/(momin|mst)/ url reject

# ===== 广告曝光埋点 (可选, 可自行删除) =====
^https?://sc\.appvipshop\.com/vips-mobile-tracker/router\.do.*advtrigger url reject

# ===== 开屏开关强制关闭 (可选, 需配合本地脚本 startup_v3.js, 见 README) =====
# ^https://mapi\.appvipshop\.com/vips-mobile/rest/operation/startup/v3 url script-response-body startup_v3.js
