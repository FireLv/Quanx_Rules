// ==UserScript==
// @ScriptName        翼支付 + 中国移动 去开屏广告
// @Author            规则体系 @ddgksf2013｜本文件由 2026-09-18 抓包实证整理
// @UpdateTime        2026-09-19
// @Evidence          quantumult-x-2026-09-18-103204.har（15:08:40~15:10:01 UTC；UA: bestpay/10.98.30、ChinaMobile/12.5.4、leadeon/12.5.4）
// @CrossCheck        与《墨鱼去开屏 V2.0》QX 版核对：sdk.1rtb.net/sdk/req_ad（第873行）、client.app.coc.10086.cn/biz-orange/DN/init/startInit（第978行）为社区既有规则；unionOpenAds 与 yksdks 为本包独有实证
// @Attention         ① HTTPS 规则依赖 MITM，远程引用时 hostname 自动并入；手工粘贴须把 hostname 行改写进 [mitm]。② 中国移动开屏素材走本地缓存，首次启用后建议连续两次冷启动再判断效果。③ client.app.coc.10086.cn 为移动高频业务域，加入 MITM 后每次启动约 50+ 条请求会解密，属必要成本；介意可删该条并接受移动开屏可能不完全生效。
// ==/UserScript==


hostname = mapi-app.bestpay.com.cn, client.app.coc.10086.cn, api-p0.yksdks.com

# ======= 翼支付（本包实证） =======

# > 开屏广告取数接口：响应体即开屏广告数据（bigImage 落地页含 channel=qg-dx-yzf-splash，与截图 IMG_0646 对应）
^https?:\/\/mapi-app\.bestpay\.com\.cn\/gapi\/appClient\/noEnc\/unionOpenAds url reject-200

# > 1rtb 广告 SDK 取广告（http 明文，无需 MITM；与墨鱼去开屏第873行同款，本包命中 2 次）
^https?:\/\/sdk\.1rtb\.net\/sdk\/req_ad url reject-200

# > adn-plus 广告 SDK 竞价接口（http 明文，无需 MITM；响应为密文无法改写，只能整拦）
^https?:\/\/ad-api\.adn-plus\.com\.cn\/mb\/sdk1\/json url reject-200

# > sogaha 广告曝光埋点（http 明文，无需 MITM）
^https?:\/\/ctrace\.sogaha\.cn\/sdkLogPathUrl url reject

# > tanx（阿里妈妈 ADX）竞价回调：需 MITM et.tanx.com，默认注释，介意 MITM 域过多可保持注释
# ^https?:\/\/et\.tanx\.com\/tsc url reject-200

# > 翼支付联盟广告 SDK（zjchjc，响应加密）：需 MITM open-api.zjchjc.cn，默认注释
# ^https?:\/\/open-api\.zjchjc\.cn\/bcsdk url reject-200

# ======= 中国移动（部分实证 + 社区印证） =======

# > 启动初始化配置（墨鱼去开屏第978行同款；本包命中 200 空响应，reject-200 行为一致零副作用）
^https?:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/DN\/init\/startInit url reject-200

# > YK 广告 SDK（YKAdSDK 聚合广告，appkey=5df133447d37 apppkg=cn.10086.app）开屏配置拉取：
#   冷启动首个业务请求，响应加密（"sc" 密文字段）无法脚本改写，只能整请求拦截
^https?:\/\/api-p0\.yksdks\.com\/v6\/gcf url reject-200

# ======= 中国移动 首页弹窗（2026-09-19 主人要求启用） =======

# > 首页弹窗取数（本包 15:09:07.278 命中 200 / 3328B；响应为密文无法脚本裁剪，只能整请求拦截）
#    ⚠ 副作用：该接口同时承载自营运营活动弹窗，拦截后首页活动弹窗一并消失，属「去广告」而非「只去三方广告」
^https?:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/DN\/homepagePopup\/getSortInfo url reject-200


# ------- 以下为可选扩展，默认注释 -------

# > 退出挽留弹窗 / toast（语义上属弹窗类，本包命中 200 但响应极小，未确认是否含广告，按需启用）
# ^https?:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/DN\/detainment\/august\/getPages url reject-200
# ^https?:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/DH\/toast\/august\/getPages url reject-200
# ^https?:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/DN\/toast\/getToastRule url reject-200

# > YK SDK 数据/日志域（埋点类，拦截无副作用但非必需）
# ^https?:\/\/api-d\.yksdks\.com\/v5\/gcl url reject-200
# ^https?:\/\/devs-data\.yksdks\.com\/dinfo url reject-200

# > 中移市场数据埋点
# ^https?:\/\/da\.mmarket\.com\/udata_v5\/appsdk\/postsyslog url reject-200


# ==== 实证依据 ====
# 时序（HAR 内 UTC 时间）：
#   翼支付冷启动 15:08:40.849 unionOpenAds 返回开屏广告 JSON（note="新消费-客户端-流量包-流量优选-新"，
#     bigImage=cdn.bestpay.cn/.../rBwwImqnwhOAQZnrAAp-izW7yzM384.png），15:08:41.148 该图 687KB 下载成功
#     —— 与截图 IMG_0646「流量优选领券」完全对应，取数→素材链路闭环。
#   中国移动冷启动 15:09:02.304/311 api-p0.yksdks.com nndm + v6/gcf 为最早发出的业务请求，
#     gcf 响应体为 {"status":200,"sc":"<密文>"} 结构；yksdks.com 经查为 YKAdSDK 聚合广告 SDK
#     （官方文档含 YKAdSplashView 开屏组件），appkey/apppkg 参数指向 cn.10086.app。
# 开屏命中数：unionOpenAds 1 次；sdk.1rtb.net/sdk/req_ad 2 次；adn-plus/mb/sdk1/json 2 次；
#   startInit 1 次（200 空体）；api-p0.yksdks.com/v6/gcf 1 次。
#
# ==== 已知局限 ====
# 1. 翼支付【首页弹窗】本包未捕获到对应接口。原因：抓包时段（82 秒）只覆盖冷启动，未停留在首页触发弹窗取数。
#    如需屏蔽翼支付弹窗，需重抓：开抓包 → 冷启动翼支付 → 首页停留 10 秒以上 → 再导出。
#    目前的推测候选只有 open-api.zjchjc.cn/bcsdk 联盟广告 SDK 配置（响应 64KB 密文），已在可选段默认注释。
# 2. 移动开屏素材有本地缓存机制：拦截配置接口后，历史缓存素材可能再显示一次，连续两次冷启动后应消失。
# 2. 若移动服务端日后改由自家域名下发开屏数据（不走 yksdks），本规则需重新抓包校正。
# 3. 翼支付 unionOpenAds 为「联合开屏」接口，拦截后所有开屏位（含自家运营活动）均不再展示；
#    若想保留自营活动仅去三方广告，需改用 script-response-body 精细过滤——但本包内该接口明文可读，
#    可按 note 字段判断，需要的话另行定制。
# 4. 严禁拦截（基础设施域，会导致登录/推送/安全校验异常）：atoken.m.taobao.com、amdc.m.taobao.com、
#    dypnsapi-dualstack.aliyuncs.com（号码认证）、ha-cmim.cmcc-cs.cn、push.it.10086.cn、
#    10086.online-cmcc.cn、clientaccess.10086.cn、h.app.coc.10086.cn。
#
# ==== 手工并入 quantumult_merged_20260912.conf 的方法 ====
# 1. 规则行复制进 [rewrite_local] 段（追加在京东增量规则之后即可）。
# 2. [mitm] hostname 只需手工追加 2 个域：mapi-app.bestpay.com.cn、api-p0.yksdks.com。
#    其余两个不必加：client.app.coc.10086.cn 与 *.1rtb.net 已由 [rewrite_remote] 的
#    StartUpAds.conf（墨鱼去开屏）自带 hostname 自动并入。
#    写法示例（保留原有 - 排除项与 event.00bang.cn，勿覆盖 passphrase / p12）：
#      hostname = -testflight.apple.com, -*.fcbox.com, -*huami.com, -*amemv.com, -*snssdk.com,
#                 -www.google.com, event.00bang.cn, mapi-app.bestpay.com.cn, api-p0.yksdks.com
# 3. 若改为远程引用（[rewrite_remote] 加一行本文件 URL），则 hostname 一行会自动并入，可省第 2 步。
# ==== 操作说明结束 ====
